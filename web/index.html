<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="KardexBar - Sistema de control de ventas, comandas, arqueo de barra e inventario físico.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KardexBar">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

  <!-- Favicons oficiales -->
  <link rel="icon" type="image/x-icon" href="favicon.ico"/>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">

  <title>KardexBar - Control de Barra e Inventario</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #00162B;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Pantalla de Booteo / Splash Screen de KardexBar */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #00162B;
      z-index: 999999;
      transition: opacity 0.5s ease-out;
    }

    .boot-logo-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 24px;
    }

    .boot-logo {
      width: 120px;
      height: 120px;
      object-fit: contain;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      animation: pulse-logo 2s infinite ease-in-out;
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(39, 160, 215, 0.2);
      border-top-color: #27A0D7;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    .boot-text {
      color: #BCD3E5;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 600;
      margin-top: 18px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse-logo {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 12px rgba(220, 38, 38, 0.3)); }
      50% { transform: scale(1.05); filter: drop-shadow(0 0 24px rgba(220, 38, 38, 0.6)); }
    }
  </style>
</head>
<body>
  <!-- Pantalla visual de booteo de la aplicación -->
  <div id="loading-screen">
    <div class="boot-logo-container">
      <img src="KardexBar-Logo.png" alt="KardexBar" class="boot-logo">
    </div>
    <div class="spinner"></div>
    <div class="boot-text">Iniciando KardexBar...</div>
  </div>

  <script>
    window.addEventListener('load', function(ev) {
      // Remover la pantalla de booteo suavemente cuando Flutter cargue
      var loader = document.getElementById('loading-screen');
      if (loader) {
        setTimeout(function() {
          loader.style.opacity = '0';
          setTimeout(function() {
            if (loader.parentNode) {
              loader.parentNode.removeChild(loader);
            }
          }, 500);
        }, 400);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
